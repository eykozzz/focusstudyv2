<style>
/* ============================================================
   DESIGN SYSTEM — Neutral dark with sharp orange accent
   Font: Bricolage Grotesque (display) + Outfit (body)
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Outfit:wght@300;400;500;600&display=swap');

:root {
  --bg:        #f4f3f0;
  --bg2:       #eae8e3;
  --bg3:       #dedbd4;
  --card:      #ffffff;
  --card2:     #f0ede8;
  --tx:        #18171a;
  --tx2:       #6e6a72;
  --tx3:       #aaa6ae;
  --acc:       #ff5e3a;
  --acc-dim:   rgba(255,94,58,.18);
  --acc-glow:  rgba(255,94,58,.28);
  --green:     #2ecc71;
  --red:       #ff3b30;
  --brd:       #e2dfd8;
  --trk:       #e2dfd8;
  --shadow:    0 2px 16px rgba(0,0,0,.08);
  --r:         18px;
  --safe-top:  env(safe-area-inset-top, 14px);
  --safe-bot:  env(safe-area-inset-bottom, 8px);
}
[data-theme=dark] {
  --bg:       #0d0d0f;
  --bg2:      #161619;
  --bg3:      #1e1e22;
  --card:     #161619;
  --card2:    #1e1e22;
  --tx:       #f0ede8;
  --tx2:      #8e8a94;
  --tx3:      #55515c;
  --brd:      #28252e;
  --trk:      #1e1e22;
  --shadow:   0 2px 24px rgba(0,0,0,.45);
}
[data-theme=oled] {
  --bg:       #000;
  --bg2:      #090909;
  --bg3:      #111;
  --card:     #0d0d0d;
  --card2:    #111;
  --tx:       #fff;
  --tx2:      #777;
  --tx3:      #444;
  --brd:      #1a1a1a;
  --trk:      #111;
  --shadow:   0 2px 24px rgba(0,0,0,.8);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--tx); font-family:'Outfit',sans-serif; -webkit-font-smoothing:antialiased; }
input,textarea,select { font:inherit; font-size:16px!important; outline:none; }
button { font:inherit; border:none; cursor:pointer; background:none; color:inherit; }

/* ── Layout ── */
#app { display:flex; flex-direction:column; height:100dvh; width:100%; max-width:600px; margin:0 auto; position:relative; overflow:hidden; background:var(--bg); }
@media(min-width:600px) {
  body { background:var(--bg2); }
  #app { border-left:1px solid var(--brd); border-right:1px solid var(--brd); box-shadow:0 0 40px rgba(0,0,0,.15); }
}
#header { flex-shrink:0; padding:calc(var(--safe-top) + 6px) 20px 14px; background:var(--bg); border-bottom:1px solid var(--brd); display:flex; align-items:center; justify-content:space-between; }
#header h1 { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:22px; letter-spacing:-.5px; color:var(--tx); }
#header .subtitle { font-size:11px; color:var(--tx3); margin-top:2px; text-transform:capitalize; }
#content { flex:1; overflow:hidden; position:relative; }
.tab-view { position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden; transition:opacity .18s ease; }
.tab-view.hidden { opacity:0; pointer-events:none; }
#nav { flex-shrink:0; background:var(--bg); border-top:1px solid var(--brd); padding-bottom:var(--safe-bot); display:flex; }
.nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:10px 0; position:relative; }
.nav-btn svg { transition:color .15s; }
.nav-btn span { font-size:10px; font-weight:500; color:var(--tx3); transition:color .15s; }
.nav-btn.active svg { color:var(--acc); }
.nav-btn.active span { color:var(--acc); }
.nav-pill { position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:24px; height:3px; background:var(--acc); border-radius:3px 3px 0 0; }
.focus-dot { position:absolute; top:8px; right:calc(50% - 20px); width:7px; height:7px; border-radius:50%; background:var(--acc); box-shadow:0 0 6px var(--acc); }

/* ── Scroll ── */
.scroll { overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.scroll::-webkit-scrollbar { display:none; }

/* ── Buttons ── */
.btn { display:inline-flex; align-items:center; justify-content:center; border-radius:var(--r); font-weight:600; transition:transform .12s ease, opacity .12s ease, box-shadow .15s; cursor:pointer; min-height:48px; }
.btn:active { transform:scale(.94); opacity:.88; }
.btn-accent { background:var(--acc); color:#fff; box-shadow:0 5px 18px var(--acc-glow); }
.btn-ghost  { background:var(--card2); color:var(--tx2); }
.btn-danger { background:rgba(255,59,48,.12); color:var(--red); border:1.5px solid rgba(255,59,48,.25); }
.btn-icon   { width:42px; height:42px; border-radius:14px; background:var(--card2); color:var(--tx2); }

/* ── Cards ── */
.card { background:var(--card); border:1px solid var(--brd); border-radius:var(--r); }

/* ── Input ── */
.field { width:100%; background:var(--bg2); color:var(--tx); border:1.5px solid var(--brd); border-radius:14px; padding:12px 16px; transition:border-color .15s; }
.field:focus { border-color:var(--acc); }
.field::placeholder { color:var(--tx3); }
label.lbl { display:block; font-size:12px; font-weight:600; color:var(--tx2); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }

/* ── Animations ── */
@keyframes slideUp   { from{transform:translateY(100%)} to{transform:translateY(0)} }
@keyframes fadeIn    { from{opacity:0} to{opacity:1} }
@keyframes glowPulse { 0%,100%{opacity:.45;transform:scale(.95)} 50%{opacity:.15;transform:scale(1.05)} }
@keyframes popIn     { 0%{transform:scale(.85);opacity:0} 60%{transform:scale(1.04)} 100%{transform:scale(1);opacity:1} }
@keyframes spin      { to{transform:rotate(360deg)} }

/* ── Modal ── */
#modal-overlay {
  display:none; position:fixed; inset:0; z-index:100;
  background:rgba(0,0,0,.6); backdrop-filter:blur(8px);
  align-items:flex-end; justify-content:center;
}
#modal-overlay.open { display:flex; }
#modal-sheet {
  width:100%; max-width:430px; max-height:92dvh;
  background:var(--card); border-top:1px solid var(--brd);
  border-radius:28px 28px 0 0;
  animation:slideUp .28s cubic-bezier(.32,.72,0,1);
  overflow:hidden; display:flex; flex-direction:column;
}
#modal-scroll { overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1; padding:0 20px 24px; scrollbar-width:none; }
#modal-scroll::-webkit-scrollbar { display:none; }
.modal-handle { width:36px; height:4px; background:var(--brd); border-radius:2px; margin:12px auto 16px; flex-shrink:0; }

/* ── Toast ── */
#toast {
  position:fixed; top:calc(var(--safe-top) + 60px); left:50%; transform:translateX(-50%) translateY(-10px);
  background:var(--tx); color:var(--bg); padding:9px 18px; border-radius:50px;
  font-size:13px; font-weight:600; white-space:nowrap;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:200;
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ── Planning ── */
.cal-tabs { display:flex; gap:4px; background:var(--card2); border-radius:14px; padding:4px; margin:0 16px 12px; }
.cal-tab { flex:1; padding:8px; border-radius:10px; font-size:13px; font-weight:600; color:var(--tx2); text-align:center; transition:all .15s; }
.cal-tab.active { background:var(--acc); color:#fff; box-shadow:0 3px 10px var(--acc-glow); }
.cal-nav { display:flex; align-items:center; justify-content:space-between; padding:0 16px; margin-bottom:12px; }
.cal-nav h2 { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:17px; color:var(--tx); cursor:pointer; }
.cal-nav-btn { width:36px; height:36px; border-radius:12px; background:var(--card); display:flex; align-items:center; justify-content:center; color:var(--tx2); box-shadow:var(--shadow); }
.cal-nav-btn:active { transform:scale(.92); }

/* Month grid */
.month-grid { padding:0 16px; }
.month-days-header { display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px; }
.month-days-header span { text-align:center; font-size:10px; font-weight:700; color:var(--tx3); padding:4px 0; text-transform:uppercase; letter-spacing:.3px; }
.month-grid-cells { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.month-cell { min-height:46px; border-radius:12px; display:flex; flex-direction:column; align-items:center; padding:6px 2px 4px; cursor:pointer; transition:background .12s; position:relative; }
.month-cell:active { transform:scale(.92); }
.month-cell .day-num { font-weight:700; font-size:14px; line-height:1; color:var(--tx); }
.month-cell.today .day-num { color:var(--acc); }
.month-cell.selected { background:var(--acc); }
.month-cell.selected .day-num { color:#fff; }
.month-cell .dot-row { display:flex; gap:2px; justify-content:center; margin-top:4px; flex-wrap:wrap; }
.dot { width:5px; height:5px; border-radius:50%; background:var(--acc); }
.month-cell.selected .dot { background:rgba(255,255,255,.7); }
.dot.done { background:var(--green); }

/* Week grid */
.week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; padding:0 16px; }
.week-cell { border-radius:14px; padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; background:var(--card); border:1px solid var(--brd); min-height:88px; transition:all .15s; }
.week-cell:active { transform:scale(.93); }
.week-cell .wday { font-size:9px; font-weight:700; color:var(--tx3); text-transform:uppercase; letter-spacing:.4px; }
.week-cell .wnum { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:18px; color:var(--tx); }
.week-cell.today .wnum { color:var(--acc); }
.week-cell.selected { background:var(--acc); border-color:var(--acc); box-shadow:0 4px 14px var(--acc-glow); }
.week-cell.selected .wday { color:rgba(255,255,255,.7); }
.week-cell.selected .wnum { color:#fff; }
.week-task-chip { background:var(--bg3); border-radius:5px; padding:2px 4px; font-size:8px; font-weight:500; color:var(--tx2); width:100%; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.week-cell.selected .week-task-chip { background:rgba(255,255,255,.18); color:#fff; }

/* Day display */
.day-block { margin:0 16px; background:var(--card); border:1px solid var(--brd); border-radius:var(--r); padding:16px; display:flex; align-items:center; gap:14px; }
.day-badge { width:52px; height:60px; border-radius:14px; background:var(--bg3); display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; }
.day-badge.today { background:var(--acc); }
.day-badge .dbday { font-size:10px; font-weight:700; text-transform:uppercase; color:var(--tx3); letter-spacing:.4px; }
.day-badge.today .dbday { color:rgba(255,255,255,.75); }
.day-badge .dbnum { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:28px; color:var(--tx); line-height:1; }
.day-badge.today .dbnum { color:#fff; }

/* Divider */
.section-div { display:flex; align-items:center; gap:10px; padding:12px 16px 8px; }
.section-div::before,.section-div::after { content:''; flex:1; height:1px; background:var(--brd); }
.section-div span { font-size:11px; font-weight:600; color:var(--tx3); white-space:nowrap; }

/* Task card */
.task-card { border-radius:var(--r); border:1.5px solid var(--brd); background:var(--card); padding:14px; margin-bottom:10px; transition:border-color .2s, opacity .2s; }
.task-card.done { border-color:rgba(46,204,113,.35); opacity:.72; }
.task-card-inner { display:flex; align-items:flex-start; gap:12px; }
.task-check { width:26px; height:26px; border-radius:50%; border:2px solid var(--brd); background:transparent; flex-shrink:0; display:flex; align-items:center; justify-content:center; margin-top:1px; transition:all .2s; cursor:pointer; }
.task-check.checked { background:var(--green); border-color:var(--green); }
.task-body { flex:1; min-width:0; }
.task-title { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:15px; color:var(--tx); line-height:1.25; }
.task-card.done .task-title { text-decoration:line-through; }
.task-meta { display:flex; gap:10px; margin-top:4px; flex-wrap:wrap; }
.task-meta span { font-size:11px; color:var(--tx3); }
.task-meta .done-time { color:var(--acc); font-weight:600; }
.task-progress { margin-top:8px; height:4px; background:var(--trk); border-radius:4px; overflow:hidden; }
.task-progress-fill { height:100%; border-radius:4px; background:var(--acc); transition:width .4s cubic-bezier(.4,0,.2,1); }
.task-card.done .task-progress-fill { background:var(--green); }
.task-notes { font-size:11px; color:var(--tx3); font-style:italic; margin-top:6px; }
.task-actions { display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
.task-act-btn { width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; }
.task-act-play { background:var(--acc); box-shadow:0 3px 10px var(--acc-glow); }
.task-act-edit { background:var(--card2); }
.task-act-btn:active { transform:scale(.88); }
.task-act-btn:disabled { background:var(--bg3)!important; box-shadow:none!important; opacity:.5; cursor:not-allowed; }

/* Empty state */
.empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 20px; gap:10px; }
.empty .emoji { font-size:44px; }
.empty p { font-size:14px; color:var(--tx3); text-align:center; }

/* ── Focus Tab ── */
#focus-view { align-items:center; justify-content:flex-start; padding-top:8px; }
.focus-task-banner { width:100%; margin:0 16px; width:calc(100% - 32px); background:var(--card2); border-radius:20px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; }
.focus-task-banner .ftitle { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:16px; color:var(--tx); }
.focus-task-banner .fphase { font-size:13px; font-weight:600; margin-top:2px; }
.focus-cycles { display:flex; gap:8px; align-items:center; margin:10px 0; }
.cyc-dot { border-radius:50%; background:var(--trk); transition:all .3s ease; }
.cyc-dot.done-cyc { background:var(--acc); }

/* SVG Timer */
.timer-wrap { position:relative; width:240px; height:240px; flex-shrink:0; }
.timer-glow { position:absolute; inset:16px; border-radius:50%; pointer-events:none; animation:glowPulse 2.5s ease-in-out infinite; }
.timer-glow.work { background:radial-gradient(circle,rgba(255,94,58,.12) 0%,transparent 70%); }
.timer-glow.brk  { background:radial-gradient(circle,rgba(46,204,113,.12) 0%,transparent 70%); }
#timer-svg { transform:rotate(-90deg); }
#timer-track { fill:none; stroke:var(--trk); stroke-width:10; }
#timer-arc   { fill:none; stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .95s linear, stroke .3s; }
.timer-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
.timer-time { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:52px; letter-spacing:-3px; color:var(--tx); line-height:1; }
.timer-label { font-size:13px; font-weight:600; }

/* Focus controls */
.focus-stats { display:flex; gap:8px; width:100%; padding:0 16px; }
.fstat { flex:1; background:var(--card2); border-radius:14px; padding:10px; text-align:center; }
.fstat .fval { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:20px; color:var(--tx); }
.fstat .flbl { font-size:10px; color:var(--tx3); margin-top:2px; text-transform:uppercase; letter-spacing:.3px; }
.focus-btns { display:flex; align-items:center; justify-content:center; gap:16px; width:100%; padding:0 16px; }
.fbtn-side { width:68px; height:68px; border-radius:20px; background:var(--card2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.fbtn-side span { font-size:10px; color:var(--tx3); }
.fbtn-side .fval2 { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:22px; color:var(--acc); }
.fbtn-main { width:72px; height:72px; border-radius:50%; background:var(--acc); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 24px var(--acc-glow); transition:background .2s, box-shadow .2s, transform .12s; }
.fbtn-main:active { transform:scale(.92); }
.fbtn-main.paused { background:var(--card2); box-shadow:none; }
.fbtn-side:active { transform:scale(.91); }

/* Focus empty */
.focus-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:40px 32px; gap:16px; text-align:center; }
.focus-empty .big-emoji { font-size:64px; animation:popIn .5s cubic-bezier(.34,1.56,.64,1); }
.focus-empty h2 { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:26px; color:var(--tx); }
.focus-empty p { font-size:15px; color:var(--tx2); line-height:1.5; }

/* ── Settings ── */
#settings-view { padding:0 16px 32px; }
.settings-hero { text-align:center; padding:20px; background:var(--card2); border-radius:24px; margin-bottom:20px; }
.settings-hero .big { font-size:48px; }
.settings-hero h1 { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:24px; color:var(--tx); margin-top:8px; }
.settings-hero p { font-size:12px; color:var(--tx3); margin-top:4px; }
.settings-section { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:17px; color:var(--tx); margin:20px 0 10px; }
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:4px; }
.stat-card { background:var(--card); border:1px solid var(--brd); border-radius:16px; padding:12px 14px; }
.stat-card .sval { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:26px; color:var(--tx); }
.stat-card .slbl { font-size:11px; color:var(--tx3); margin-top:2px; }
.stat-card .sico { font-size:22px; margin-bottom:6px; }
.theme-option { background:var(--card); border:1.5px solid var(--brd); border-radius:16px; padding:14px 16px; display:flex; align-items:center; gap:14px; margin-bottom:8px; cursor:pointer; transition:all .15s; }
.theme-option:active { transform:scale(.97); }
.theme-option.active { background:var(--acc); border-color:var(--acc); box-shadow:0 4px 16px var(--acc-glow); }
.theme-icon { width:42px; height:42px; border-radius:13px; background:var(--bg3); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s; }
.theme-option.active .theme-icon { background:rgba(255,255,255,.2); }
.theme-name { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:15px; color:var(--tx); transition:color .15s; }
.theme-option.active .theme-name { color:#fff; }
.theme-desc { font-size:12px; color:var(--tx2); margin-top:1px; transition:color .15s; }
.theme-option.active .theme-desc { color:rgba(255,255,255,.7); }
.info-row { background:var(--card); border:1px solid var(--brd); border-radius:var(--r); overflow:hidden; }
.info-item { display:flex; justify-content:space-between; align-items:center; padding:13px 16px; border-bottom:1px solid var(--brd); }
.info-item:last-child { border-bottom:none; }
.info-item .ik { font-size:13px; color:var(--tx2); }
.info-item .iv { font-size:13px; font-weight:600; color:var(--tx); }
.save-indicator { display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--brd); border-radius:var(--r); padding:14px 16px; margin-bottom:8px; }
.save-dot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 7px var(--green); margin-right:8px; }
.save-badge { display:flex; align-items:center; background:rgba(46,204,113,.12); border-radius:50px; padding:5px 12px; }
.save-badge span { font-size:12px; font-weight:700; color:var(--green); }
.reset-confirm { background:rgba(255,59,48,.08); border:1.5px solid rgba(255,59,48,.3); border-radius:16px; padding:16px; }
.reset-confirm p { font-size:13px; color:var(--red); font-weight:600; text-align:center; margin-bottom:4px; }
.reset-confirm small { display:block; font-size:11px; color:var(--tx3); text-align:center; margin-bottom:12px; }

/* ── Modal fields ── */
.modal-title { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:20px; color:var(--tx); }
.modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.field-num { text-align:center; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:22px; color:var(--acc); }
.calc-row { background:var(--bg3); border-radius:12px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.calc-row span:first-child { font-size:13px; color:var(--tx3); }
.calc-row span:last-child  { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:16px; color:var(--acc); }

/* ── Offline banner ── */
#offline-banner {
  position:fixed; top:0; left:0; right:0; z-index:300;
  background:#1a1a2e; color:#fff; text-align:center;
  font-size:12px; font-weight:600; padding:6px;
  transform:translateY(-100%); transition:transform .3s;
}
#offline-banner.show { transform:translateY(0); }
#fab-add:active { transform:scale(.88) !important; }
</style>
</head>
<body>
<div id="offline-banner">📵 Hors-ligne — données locales</div>
<div id="app">
  <div id="header">
    <div>
      <h1>FocusStudy</h1>
      <div class="subtitle" id="header-sub">chargement…</div>
    </div>
    <div id="header-action-area"></div>
  </div>

  <div id="content">
    <!-- Planning -->
    <div class="tab-view" id="planning-view">
      <div class="scroll" style="flex:1" id="planning-scroll">
      <div style="flex-shrink:0">
        <div class="cal-tabs" id="cal-tabs">
          <button class="cal-tab" data-view="day">Jour</button>
          <button class="cal-tab" data-view="week">Semaine</button>
          <button class="cal-tab active" data-view="month">Mois</button>
        </div>
        <div class="cal-nav">
          <button class="cal-nav-btn" id="cal-prev">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <h2 id="cal-title" style="cursor:pointer">—</h2>
          <button class="cal-nav-btn" id="cal-next">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div id="cal-body"></div>
      </div>
      <div id="task-divider" class="section-div"><span id="task-count-label">—</span></div>
      <div style="padding:0 16px 100px" id="task-list-container">
        <div id="task-list"></div>
      </div>
      </div>
      <!-- FAB -->
      <button id="fab-add" style="position:absolute;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;box-shadow:0 6px 24px var(--acc-glow);display:none;align-items:center;justify-content:center;z-index:10;transition:transform .15s,opacity .15s">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
      </button>
    </div>

    <!-- Focus -->
    <div class="tab-view hidden" id="focus-view"></div>

    <!-- Settings -->
    <div class="tab-view hidden scroll" id="settings-view"></div>
  </div>

  <nav id="nav">
    <button class="nav-btn" data-tab="planning">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="var(--tx3)"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Planning</span>
    </button>
    <button class="nav-btn" data-tab="focus">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="var(--tx3)"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Focus</span>
    </button>
    <button class="nav-btn" data-tab="settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="var(--tx3)"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Réglages</span>
    </button>
  </nav>
</div>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal-sheet">
    <div class="modal-handle"></div>
    <div id="modal-scroll"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
/* ============================================================
   FOCUSSTUDY ULTIMATE — Vanilla JS PWA
   Architecture : State → Render → Events
   Pas de framework, pas de dépendance CDN
   ============================================================ */

/* ── Utils ── */
const $ = (s, ctx=document) => ctx.querySelector(s);
const $$ = (s, ctx=document) => [...ctx.querySelectorAll(s)];
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const pad2  = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const fmtDs    = d => { const dt=typeof d==='string'?new Date(d+'T12:00'):d; return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`; };
const FR_D  = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const FR_DL = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const FR_M  = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const el    = (tag, attr={}, ...kids) => {
  const e = document.createElement(tag);
  Object.entries(attr).forEach(([k,v]) => k==='class'?e.className=v:k==='style'?Object.assign(e.style,v):e.setAttribute(k,v));
  kids.forEach(k => typeof k==='string' ? e.insertAdjacentHTML('beforeend',k) : k && e.appendChild(k));
  return e;
};

/* ── Storage ── */
const SK = { TASKS:'fsu_t4', SET:'fsu_s4', UI:'fsu_u4' };
const lsGet = (k, fb) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):fb; } catch { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) {
  if(e.name==='QuotaExceededError') { Object.values(SK).forEach(x=>x!==k&&localStorage.removeItem(x)); try { localStorage.setItem(k,JSON.stringify(v)); return true; } catch{} }
  return false;
}};

/* ── State ── */
const savedUI = lsGet(SK.UI, {});
const state = {
  tasks:    lsGet(SK.TASKS, []),
  settings: lsGet(SK.SET,   { theme:'dark' }),
  ui: {
    tab:     savedUI.tab     || 'planning',
    calView: savedUI.calView || 'month',
    selDate: savedUI.selDate || todayStr(),
    focusId: savedUI.focusId || null,
  },
  timer: {
    running:  false,
    isBreak:  false,
    timeLeft:  0,
    totalSecs: 0,
    interval:  null,
  },
};

/* ── Persist ── */
const persist = () => {
  lsSet(SK.TASKS, state.tasks);
  lsSet(SK.SET,   state.settings);
  lsSet(SK.UI,    state.ui);
};

/* ── Toast ── */
let toastTimer;
const showToast = msg => {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
};

/* ============================================================
   PLANNING RENDERER
   ============================================================ */
function renderPlanning() {
  const { calView, selDate } = state.ui;
  const d = new Date(selDate+'T12:00');
  const today = todayStr();

  // Header — show selected date (highlight if today)
  const isToday = selDate === today;
  const dateLabel = isToday
    ? `Aujourd'hui · ${FR_DL[d.getDay()]} ${d.getDate()} ${FR_M[d.getMonth()].toLowerCase()}`
    : `${FR_DL[d.getDay()]} ${d.getDate()} ${FR_M[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;
  $('#header-sub').textContent = dateLabel;
  $('#header-sub').style.color = isToday ? 'var(--acc)' : '';

  // FAB
  const fab = $('#fab-add');
  if(fab) { fab.style.display='flex'; fab.onclick=()=>openModal(null, selDate); }
  const ha = $('#header-action-area');
  if(ha) ha.innerHTML='';
  // hide old header-action if it exists
  const oldBtn = $('#header-action');
  if(oldBtn) oldBtn.style.display='none';

  // Tabs
  $$('#cal-tabs .cal-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.view === calView));

  // Calendar title
  let title = '';
  if(calView==='month') title = `${FR_M[d.getMonth()]} ${d.getFullYear()}`;
  else if(calView==='week') {
    const dow=(d.getDay()+6)%7, mon=new Date(d); mon.setDate(d.getDate()-dow);
    const sun=new Date(mon); sun.setDate(mon.getDate()+6);
    title = `${mon.getDate()} – ${sun.getDate()} ${FR_M[mon.getMonth()].slice(0,4).toLowerCase()}.`;
  } else {
    title = `${FR_DL[d.getDay()]} ${d.getDate()} ${FR_M[d.getMonth()].toLowerCase()}`;
  }
  $('#cal-title').textContent = title;

  // Calendar body
  const body = $('#cal-body');
  body.innerHTML = '';
  if(calView==='month')      body.appendChild(renderMonthGrid(d));
  else if(calView==='week')  body.appendChild(renderWeekGrid(d));
  else                       body.appendChild(renderDayBlock(d));

  // Task list
  const tasksForDay = state.tasks.filter(t => t.date===selDate);
  $('#task-count-label').textContent = `${selDate===today?'Aujourd\'hui · ':''} ${d.getDate()} ${FR_M[d.getMonth()].toLowerCase()} · ${tasksForDay.length} tâche${tasksForDay.length!==1?'s':''}`;
  const tl = $('#task-list');
  tl.innerHTML = '';
  if(tasksForDay.length===0) {
    tl.innerHTML = `<div class="empty"><div class="emoji">📭</div><p>Aucune tâche ce jour</p><button class="btn btn-ghost" style="min-width:160px;font-size:14px" id="empty-add">+ Ajouter</button></div>`;
    $('#empty-add').addEventListener('click', () => openModal(null, selDate));
  } else {
    tasksForDay.forEach(t => tl.appendChild(renderTaskCard(t)));
  }
}

function tasksOn(ds) { return state.tasks.filter(t=>t.date===ds); }

function renderMonthGrid(d) {
  const y=d.getFullYear(), m=d.getMonth();
  const first=new Date(y,m,1), dow=(first.getDay()+6)%7;
  const days=new Date(y,m+1,0).getDate();
  const today=todayStr(), sel=state.ui.selDate;
  const wrap = document.createDocumentFragment();
  const header = el('div',{class:'month-days-header'});
  ['L','M','M','J','V','S','D'].forEach(x => header.appendChild(el('span',{},x)));
  const grid = el('div',{class:'month-grid-cells'});
  for(let i=0;i<dow;i++) grid.appendChild(el('div'));
  for(let day=1;day<=days;day++) {
    const ds=`${y}-${pad2(m+1)}-${pad2(day)}`;
    const tList=tasksOn(ds);
    const cell=el('div',{class:`month-cell${ds===sel?' selected':''}${ds===today&&ds!==sel?' today':''}`,'data-date':ds});
    cell.innerHTML=`<span class="day-num">${day}</span>`;
    if(tList.length>0) {
      const dots=el('div',{class:'dot-row'});
      tList.slice(0,3).forEach(t=>{ const dot=el('div',{class:`dot${t.estTermine?' done':''}`}); dots.appendChild(dot); });
      cell.appendChild(dots);
    }
    cell.addEventListener('click', () => { state.ui.selDate=ds; persist(); renderPlanning(); });
    grid.appendChild(cell);
  }
  const container = el('div',{class:'month-grid'});
  container.appendChild(header);
  container.appendChild(grid);
  wrap.appendChild(container);
  return container;
}

function renderWeekGrid(d) {
  const dow=(d.getDay()+6)%7;
  const mon=new Date(d); mon.setDate(d.getDate()-dow);
  const today=todayStr(), sel=state.ui.selDate;
  const grid=el('div',{class:'week-grid'});
  const NAMES=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  for(let i=0;i<7;i++){
    const dd=new Date(mon); dd.setDate(mon.getDate()+i);
    const ds=fmtDs(dd);
    const tList=tasksOn(ds);
    const cell=el('div',{class:`week-cell${ds===sel?' selected':''}${ds===today&&ds!==sel?' today':''}`, 'data-date':ds});
    cell.innerHTML=`<span class="wday">${NAMES[i]}</span><span class="wnum">${dd.getDate()}</span>`;
    tList.slice(0,2).forEach(t=>{
      const chip=el('div',{class:'week-task-chip'});
      chip.textContent=t.titre;
      cell.appendChild(chip);
    });
    if(tList.length>2){ const more=el('div',{style:{fontSize:'8px',color:'inherit',opacity:'.6',textAlign:'center'}}); more.textContent=`+${tList.length-2}`; cell.appendChild(more); }
    cell.addEventListener('click', ()=>{ state.ui.selDate=ds; persist(); renderPlanning(); });
    grid.appendChild(cell);
  }
  return grid;
}

function renderDayBlock(d) {
  const today=todayStr(), ds=fmtDs(d);
  const isTod=ds===today;
  const wrap=el('div',{class:'day-block'});
  wrap.innerHTML=`
    <div class="day-badge${isTod?' today':''}">
      <span class="dbday">${FR_D[d.getDay()]}</span>
      <span class="dbnum">${d.getDate()}</span>
    </div>
    <div>
      <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;color:var(--tx);text-transform:capitalize">
        ${FR_DL[d.getDay()]} ${d.getDate()} ${FR_M[d.getMonth()].toLowerCase()}
      </div>
      <div style="font-size:12px;color:var(--tx3);margin-top:3px">${tasksOn(ds).length} tâche${tasksOn(ds).length!==1?'s':''} planifiée${tasksOn(ds).length!==1?'s':''}</div>
    </div>`;
  return wrap;
}

function renderTaskCard(task) {
  const pct = task.cyclesVoulus>0 ? Math.min((task.cyclesRealises/task.cyclesVoulus)*100,100) : 0;
  const card = el('div',{class:`task-card${task.estTermine?' done':''}`,'data-id':task.id});
  const totalMin = task.cyclesRealises*task.tempsParSession;
  card.innerHTML=`
    <div class="task-card-inner">
      <button class="task-check${task.estTermine?' checked':''}" data-action="toggle">
        ${task.estTermine?`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`:''}
      </button>
      <div class="task-body">
        <div class="task-title">${escHtml(task.titre)}</div>
        <div class="task-meta">
          <span>${task.cyclesRealises}/${task.cyclesVoulus} cycles · ${task.tempsParSession} min</span>
          ${totalMin>0?`<span class="done-time">${totalMin} min ✓</span>`:''}
        </div>
        <div class="task-progress"><div class="task-progress-fill" style="width:${pct}%"></div></div>
        ${task.notes?`<div class="task-notes">${escHtml(task.notes)}</div>`:''}
      </div>
      <div class="task-actions">
        <button class="task-act-btn${task.estTermine?'':' task-act-play'}" data-action="play" ${task.estTermine?'disabled':''} title="Lancer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="${task.estTermine?'var(--tx3)':'#fff'}"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <button class="task-act-btn task-act-edit" data-action="edit" title="Modifier">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--tx2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
      </div>
    </div>`;
  card.addEventListener('click', e => {
    const action = e.target.closest('[data-action]')?.dataset.action;
    if(action==='toggle') { toggleTask(task.id); }
    if(action==='play')   { launchFocus(task.id); }
    if(action==='edit')   { openModal(task); }
  });
  return card;
}

const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ============================================================
   FOCUS RENDERER
   ============================================================ */
const BREAK_SECS = 300; // 5 min

function launchFocus(taskId) {
  // Stop any running timer
  clearInterval(state.timer.interval);
  const task = state.tasks.find(t=>t.id===taskId);
  if(!task) return;
  state.ui.focusId = taskId;
  state.ui.tab = 'focus';
  state.timer.running  = false;
  state.timer.isBreak  = false;
  state.timer.timeLeft  = task.tempsParSession*60;
  state.timer.totalSecs = task.tempsParSession*60;
  persist();
  switchTab('focus');
}

function renderFocus() {
  $('#header-sub').textContent = 'Mode concentration';
  $('#header-sub').style.color = '';
  const fab = $('#fab-add'); if(fab) fab.style.display='none';
  const oldBtn = $('#header-action'); if(oldBtn) oldBtn.style.display='none';
  const view = $('#focus-view');
  view.innerHTML = '';

  const task = state.tasks.find(t=>t.id===state.ui.focusId);
  if(!task) {
    view.innerHTML=`<div class="focus-empty">
      <div class="big-emoji">🎯</div>
      <h2>Mode Focus</h2>
      <p>Lance une tâche depuis le planning pour démarrer une session de concentration.</p>
      <button class="btn btn-accent" style="padding:0 32px;font-size:15px" id="go-planning">Voir le Planning</button>
    </div>`;
    $('#go-planning').addEventListener('click', ()=>switchTab('planning'));
    return;
  }

  const { isBreak, timeLeft, totalSecs, running } = state.timer;
  const phaseColor = isBreak ? 'var(--green)' : 'var(--acc)';
  const realCyc = task.cyclesRealises;
  const curCyc  = isBreak ? realCyc : realCyc+1;

  // Banner
  const banner = el('div',{class:'focus-task-banner'});
  banner.innerHTML=`
    <div style="flex:1;min-width:0">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);margin-bottom:3px">EN COURS</div>
      <div class="ftitle" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(task.titre)}</div>
      <div class="fphase" style="color:${phaseColor}">${isBreak?'☕ Pause — prépare-toi !':'🎯 Cycle '+curCyc+' / '+task.cyclesVoulus}</div>
    </div>
    <button id="focus-close" style="width:36px;height:36px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:10px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--tx2)" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>`;
  banner.style.cssText='margin:0 16px;width:calc(100% - 32px);background:var(--card2);border-radius:20px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between';
  view.appendChild(banner);
  $('#focus-close').addEventListener('click', ()=>{ clearInterval(state.timer.interval); state.timer.running=false; state.ui.focusId=null; persist(); switchTab('planning'); });

  // Cycles dots
  const dots = el('div',{class:'focus-cycles'});
  for(let i=0;i<task.cyclesVoulus;i++){
    const dot=el('div',{class:'cyc-dot'+(i<realCyc?' done-cyc':'')});
    dot.style.cssText=`width:${i<realCyc?'14':'10'}px;height:${i<realCyc?'14':'10'}px;`;
    dots.appendChild(dot);
  }
  view.appendChild(dots);

  // SVG Timer
  const SIZE=240, SW=10, R=(SIZE-SW)/2, CIRC=2*Math.PI*R;
  const pct  = totalSecs>0 ? timeLeft/totalSecs : 0;
  const offset= CIRC*(1-pct);
  const timerWrap = el('div',{class:'timer-wrap'});
  timerWrap.innerHTML=`
    <div class="timer-glow ${isBreak?'brk':'work'}"></div>
    <svg id="timer-svg" width="${SIZE}" height="${SIZE}" viewBox="0 0 ${SIZE} ${SIZE}" style="transform:rotate(-90deg)">
      <circle id="timer-track" cx="${SIZE/2}" cy="${SIZE/2}" r="${R}"/>
      <circle id="timer-arc" cx="${SIZE/2}" cy="${SIZE/2}" r="${R}"
        stroke="${isBreak?'var(--green)':'var(--acc)'}"
        stroke-dasharray="${CIRC}"
        stroke-dashoffset="${offset}"/>
    </svg>
    <div class="timer-center">
      <div class="timer-time" id="timer-display">${pad2(Math.floor(timeLeft/60))}:${pad2(timeLeft%60)}</div>
      <div class="timer-label" style="color:${phaseColor}">${isBreak?'☕ Pause':'🎯 Travail'}</div>
    </div>`;
  view.appendChild(timerWrap);

  // Stats
  const stats = el('div',{class:'focus-stats'});
  stats.innerHTML=`
    <div class="fstat"><div class="fval">${realCyc}</div><div class="flbl">Cycles</div></div>
    <div class="fstat"><div class="fval">${realCyc*task.tempsParSession}</div><div class="flbl">Min faites</div></div>
    <div class="fstat"><div class="fval">${task.tempsParSession}</div><div class="flbl">Min/cycle</div></div>`;
  view.appendChild(stats);

  // Controls
  const btns=el('div',{class:'focus-btns'});
  btns.innerHTML=`
    <button class="fbtn-side" id="btn-plus5"><div class="fval2">+5</div><span>min</span></button>
    <button class="fbtn-main${running?'':' paused'}" id="btn-playpause">
      ${running
        ?`<svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`
        :`<svg width="26" height="26" viewBox="0 0 24 24" fill="${running?'#fff':'var(--acc)'}"><polygon points="5 3 19 12 5 21"/></svg>`
      }
    </button>
    <button class="fbtn-side" id="btn-skip">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--tx2)" stroke-width="2" stroke-linecap="round"><polygon points="5 4 15 12 5 20 5 4" fill="var(--tx2)" stroke="none"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      <span>Passer</span>
    </button>`;
  view.appendChild(btns);

  // Events
  $('#btn-plus5').addEventListener('click', ()=>{ state.timer.timeLeft+=300; state.timer.totalSecs+=300; updateTimerDisplay(); });
  $('#btn-skip').addEventListener('click',  ()=>{ clearInterval(state.timer.interval); state.timer.running=false; handleSessionEnd(); });
  $('#btn-playpause').addEventListener('click', ()=>{
    if(state.timer.running){ clearInterval(state.timer.interval); state.timer.running=false; renderFocus(); }
    else { startTimerInterval(); renderFocus(); }
  });
}

function startTimerInterval() {
  state.timer.running = true;
  clearInterval(state.timer.interval);
  state.timer.interval = setInterval(()=>{
    state.timer.timeLeft--;
    if(state.timer.timeLeft<=0){ clearInterval(state.timer.interval); state.timer.running=false; handleSessionEnd(); }
    else updateTimerDisplay();
  },1000);
}

function updateTimerDisplay() {
  const { timeLeft, totalSecs, isBreak } = state.timer;
  const display = $('#timer-display');
  if(display) display.textContent = `${pad2(Math.floor(timeLeft/60))}:${pad2(timeLeft%60)}`;
  const arc = $('#timer-arc');
  if(arc) {
    const R=(240-10)/2, CIRC=2*Math.PI*R;
    const pct=totalSecs>0?timeLeft/totalSecs:0;
    arc.setAttribute('stroke-dashoffset', CIRC*(1-pct));
  }
}

function handleSessionEnd() {
  const task = state.tasks.find(t=>t.id===state.ui.focusId);
  if(!task) return;
  if(!state.timer.isBreak) {
    // Work session ended
    updateTask({...task, cyclesRealises: task.cyclesRealises+1});
    showToast('✅ Cycle terminé ! Pause méritée.');
    // Ring bell via AudioContext
    try {
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      const osc=ctx.createOscillator(); const gain=ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(880,ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(440,ctx.currentTime+.5);
      gain.gain.setValueAtTime(.3,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.6);
      osc.start(); osc.stop(ctx.currentTime+.6);
    } catch(e){}
    state.timer.isBreak  = true;
    state.timer.timeLeft  = BREAK_SECS;
    state.timer.totalSecs = BREAK_SECS;
    state.timer.running   = false;
    renderFocus();
  } else {
    // Break ended → back to work
    const freshTask=state.tasks.find(t=>t.id===state.ui.focusId);
    if(!freshTask){state.ui.focusId=null;persist();renderFocus();return;}
    state.timer.isBreak  = false;
    state.timer.timeLeft  = freshTask.tempsParSession*60;
    state.timer.totalSecs = freshTask.tempsParSession*60;
    state.timer.running   = false;
    showToast('🎯 Reprise du travail !');
    renderFocus();
  }
  persist();
}

    ${[['light','☀️','Clair','Interface lumineuse'],['dark','🌙','Sombre','Confort pour les yeux'],['oled','⬛','OLED Black','Noir total — économie batterie']].map(([id,ico,name,desc])=>`

    </div>`).join('')}

    <div class="save-indicator">
      <div>
        <div style="font-size:14px;font-weight:600;color:var(--tx)">Sauvegarde automatique</div>
        <div style="font-size:12px;color:var(--tx3);margin-top:2px">Chaque modification est sauvegardée</div>
      </div>

    </div>
    <div class="info-row" style="margin-bottom:16px">
      <div class="info-item"><span class="ik">Méthode</span><span class="iv">Pomodoro adapté</span></div>
      <div class="info-item"><span class="ik">Pause standard</span><span class="iv">5 minutes</span></div>
      <div class="info-item"><span class="ik">Espace utilisé</span><span class="iv" style="color:var(--acc)">${sizeStr}</span></div>
      <div class="info-item"><span class="ik">Stockage</span><span class="iv">localStorage</span></div>

/* ============================================================
   MODAL (Task Create/Edit)
   ============================================================ */
let modalOnSave = null;
function openModal(task, defaultDate) {
  const overlay = $('#modal-overlay');
  const scroll  = $('#modal-scroll');
  const isEdit  = !!task;
  const form = task ? {...task} : {
    id:genId(), titre:'', date:defaultDate||state.ui.selDate,
    tempsParSession:25, cyclesVoulus:4, cyclesRealises:0, estTermine:false, notes:''
  };

  function buildHTML() {
    const totalMin = (form.tempsParSession||25)*(form.cyclesVoulus||4);
    return `
      <div class="modal-header">
        <div class="modal-title">${isEdit?'Modifier la tâche':'Nouvelle tâche'}</div>
        <button class="btn btn-icon" id="modal-close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--tx2)" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <label class="lbl" for="f-titre">Titre *</label>
      <input id="f-titre" class="field" type="text" placeholder="Ex: Révisions Chapitre 4…" value="${escHtml(form.titre)}" style="margin-bottom:14px">
      <label class="lbl" for="f-date">Date prévue</label>
      <input id="f-date" class="field" type="date" value="${form.date}" style="margin-bottom:14px">
      <div class="two-col" style="margin-bottom:14px">
        <div>
          <label class="lbl" for="f-tps">Min / session</label>
          <input id="f-tps" class="field field-num" type="number" min="1" max="180" value="${form.tempsParSession}">
        </div>
        <div>
          <label class="lbl" for="f-cyc">Nb. cycles</label>
          <input id="f-cyc" class="field field-num" type="number" min="1" max="20" value="${form.cyclesVoulus}">
        </div>
      </div>
      <div class="calc-row">
        <span>Temps total estimé</span>
        <span id="calc-total">${totalMin} min</span>
      </div>
      <label class="lbl" for="f-notes">Notes</label>
      <textarea id="f-notes" class="field" rows="3" placeholder="Chapitres, points clés…" style="resize:none;margin-bottom:20px">${escHtml(form.notes)}</textarea>
      <div style="display:flex;gap:10px">
        ${isEdit?`<button class="btn btn-danger btn-icon" id="modal-delete" style="width:52px;height:52px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>`:''}
        <button class="btn btn-accent" style="flex:1;font-size:15px" id="modal-save">${isEdit?'Enregistrer':'+ Créer la tâche'}</button>
      </div>`;
  }

  scroll.innerHTML = buildHTML();
  overlay.classList.add('open');
  setTimeout(()=>$('#f-titre')?.focus(),300);

  // Live recalculate
  const recalc=()=>{
    const t=parseInt($('#f-tps')?.value)||25, c=parseInt($('#f-cyc')?.value)||4;
    const el=$('#calc-total'); if(el) el.textContent=`${t*c} min`;
  };
  $('#f-tps').addEventListener('input', recalc);
  $('#f-cyc').addEventListener('input', recalc);

  const closeModal=()=>overlay.classList.remove('open');
  $('#modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', e=>e.target===overlay&&closeModal());

  if(isEdit) {
    $('#modal-delete').addEventListener('click', ()=>{
      deleteTask(form.id); closeModal(); showToast('🗑️ Tâche supprimée');
    });
  }

  $('#modal-save').addEventListener('click', ()=>{
    const titre = $('#f-titre').value.trim();
    if(!titre){ $('#f-titre').style.borderColor='var(--red)'; return; }
    const saved = {
      ...form,
      titre,
      date: $('#f-date').value || form.date,
      tempsParSession: Math.max(1, parseInt($('#f-tps').value)||25),
      cyclesVoulus:    Math.max(1, parseInt($('#f-cyc').value)||4),
      notes: $('#f-notes').value.trim(),
    };
    upsertTask(saved);
    closeModal();
    showToast(isEdit?'✏️ Tâche modifiée':'✅ Tâche créée');
    renderPlanning();
  });
}

/* ============================================================
   TASK CRUD
   ============================================================ */
function upsertTask(task) {
  const idx = state.tasks.findIndex(t=>t.id===task.id);
  if(idx>=0) state.tasks[idx]=task; else state.tasks.push(task);
  persist();
}
function updateTask(task) { upsertTask(task); }
function deleteTask(id) {
  state.tasks = state.tasks.filter(t=>t.id!==id);
  if(state.ui.focusId===id){ state.ui.focusId=null; clearInterval(state.timer.interval); state.timer.running=false; }
  persist();
  renderPlanning();
  renderFocus();
}
function toggleTask(id) {
  const t=state.tasks.find(t=>t.id===id); if(!t) return;
  t.estTermine=!t.estTermine; persist(); renderPlanning();
  showToast(t.estTermine?'🎉 Tâche terminée !':'↩️ Tâche réouverte');
}

/* ============================================================
   NAVIGATION & THEME
   ============================================================ */
function switchTab(tab) {
  state.ui.tab=tab; persist();
  $$('.tab-view').forEach(v=>v.classList.toggle('hidden', v.id!==tab+'-view'));
  $$('.nav-btn').forEach(b=>{
    const active=b.dataset.tab===tab;
    b.classList.toggle('active',active);
    let pill=b.querySelector('.nav-pill');
    if(active&&!pill){ pill=document.createElement('div'); pill.className='nav-pill'; b.appendChild(pill); }
    if(!active&&pill) pill.remove();
  });
  if(tab==='planning') renderPlanning();
  if(tab==='focus')    renderFocus();
  if(tab==='settings') renderSettings();
}

function applyTheme() {
  const t=state.settings.theme||'dark';
  document.documentElement.setAttribute('data-theme',t);
  $('#themeColor').content = t==='oled'?'#000000':t==='dark'?'#0d0d0f':'#f4f3f0';
}

/* ============================================================
   CALENDAR NAVIGATION
   ============================================================ */
function calNavigate(dir) {
  const d=new Date(state.ui.selDate+'T12:00');
  const v=state.ui.calView;
  if(v==='month')      d.setMonth(d.getMonth()+dir);
  else if(v==='week')  d.setDate(d.getDate()+dir*7);
  else                 d.setDate(d.getDate()+dir);
  state.ui.selDate=fmtDs(d); persist(); renderPlanning();
}

/* ============================================================
   OFFLINE DETECTION
   ============================================================ */
const updateOnline = () => {
  const banner=$('#offline-banner');
  if(!navigator.onLine) banner.classList.add('show');
  else banner.classList.remove('show');
};
window.addEventListener('online',  updateOnline);
window.addEventListener('offline', updateOnline);

/* ============================================================
   SERVICE WORKER (inline blob)
   Permet la mise en cache et le fonctionnement hors-ligne
   ============================================================ */
const SW_CODE = `
const CACHE='focusstudy-v3';
self.addEventListener('install',e=>{
  e.waitUntil(
    caches.open(CACHE).then(c=>c.addAll([self.registration.scope])).then(()=>self.skipWaiting())
  );
});
self.addEventListener('activate',e=>{
  e.waitUntil(
    caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())
  );
});
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET') return;
  e.respondWith(
    caches.open(CACHE).then(cache=>
      cache.match(e.request).then(cached=>{
        const net=fetch(e.request).then(res=>{
          if(res&&res.status===200&&res.type!=='opaque'){
            cache.put(e.request,res.clone());
          }
          return res;
        }).catch(()=>cached||new Response('Hors-ligne',{status:503}));
        return cached||net;
      })
    )
  );
});
`;

function registerSW() {
  if('serviceWorker' in navigator) {
    const blob = new Blob([SW_CODE], {type:'application/javascript'});
    const url  = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url, {scope:'/'})
      .catch(()=>{}); // File:// protocol will fail silently — ok
  }
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', ()=>{
  applyTheme();
  updateOnline();
  registerSW();

  // Navigation
  $$('#nav .nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>switchTab(btn.dataset.tab));
  });

  // Calendar controls
  $('#cal-prev').addEventListener('click',  ()=>calNavigate(-1));
  $('#cal-next').addEventListener('click',  ()=>calNavigate(+1));
  $('#cal-title').addEventListener('click', ()=>{ state.ui.selDate=todayStr(); persist(); renderPlanning(); });

  // Calendar view tabs
  $('#cal-tabs').addEventListener('click', e=>{
    const t=e.target.closest('.cal-tab'); if(!t) return;
    state.ui.calView=t.dataset.view; persist(); renderPlanning();
  });

  // Initial render
  switchTab(state.ui.tab);

  // Resume timer if there was a focus session running before reload
  if(state.ui.focusId) {
    const task=state.tasks.find(t=>t.id===state.ui.focusId);
    if(task && !state.timer.running) {
      const s=task.tempsParSession*60;
      if(state.timer.timeLeft<=0){ state.timer.timeLeft=s; state.timer.totalSecs=s; state.timer.isBreak=false; }
      // Timer is paused — user must hit play to resume
    }
  }
});
</script>
